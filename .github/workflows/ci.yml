name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v4

      - name: Install libav and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test the CLI
        run: |
          set -eux
          # video path
          ./build/erde gen /tmp/ci.mp4 --size 320x240 --frames 30 --codec mpeg4
          ./build/erde probe /tmp/ci.mp4
          ./build/erde transcode /tmp/ci.mp4 /tmp/ci-out.avi --size 160x120 --codec mpeg4
          ./build/erde bench /tmp/ci.mp4 /tmp/ci-bench.avi --codec mpeg4 --runs 2
          # filter path: 30 frames at 15 fps must stay 15 frames
          ./build/erde transcode /tmp/ci.mp4 /tmp/ci-fps.avi --filter 'fps=15' --fps 15 --codec mpeg4
          # audio path
          ./build/erde gen /tmp/ci-tone.m4a --audio --seconds 1 --rate 48000 --channels 2
          ./build/erde transcode-audio /tmp/ci-tone.m4a /tmp/ci-tone-out.m4a --rate 44100 --channels 1
          ./build/erde probe /tmp/ci-tone-out.m4a
          # audio filter: atempo=2.0 must halve the duration
          ./build/erde transcode-audio /tmp/ci-tone.m4a /tmp/ci-tone-fast.m4a --audio-filter 'atempo=2.0'
          ./build/erde probe /tmp/ci-tone-fast.m4a
          # multi-stream: video + audio in one file, then transcode both
          ./build/erde gen /tmp/ci-av.mp4 --size 160x120 --frames 15 --fps 15 --with-audio --seconds 1
          ./build/erde probe /tmp/ci-av.mp4 | tee /tmp/ci-av.txt
          grep -q "video(" /tmp/ci-av.txt
          grep -q "audio(" /tmp/ci-av.txt
          ./build/erde transcode /tmp/ci-av.mp4 /tmp/ci-av-out.mp4 --codec mpeg4 | tee /tmp/ci-av-out.txt
          ./build/erde probe /tmp/ci-av-out.mp4 | tee /tmp/ci-av-out-probe.txt
          grep -q "video(" /tmp/ci-av-out-probe.txt
          grep -q "audio(" /tmp/ci-av-out-probe.txt
          ./build/erde transcode /tmp/ci-av.mp4 /tmp/ci-no-audio.mp4 --codec mpeg4 --no-audio
          ./build/erde probe /tmp/ci-no-audio.mp4 | tee /tmp/ci-no-audio.txt
          if grep -q "audio(" /tmp/ci-no-audio.txt; then echo "--no-audio left an audio stream"; exit 1; fi
          # hardware path must fail cleanly on a runner without /dev/dri
          if ./build/erde transcode /tmp/ci.mp4 /tmp/hw.mp4 --hw vaapi; then
            echo "vaapi unexpectedly succeeded"; exit 1
          else
            echo "vaapi failed as expected (no device on the runner)"
          fi

  ros2-layer:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install libav, colcon and build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config python3-colcon-common-extensions \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev

      - name: Build and install the erde core library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          cmake --install build --prefix /opt/erde
          ctest --test-dir build --output-on-failure

      - name: Build the ROS 2 package
        env:
          CMAKE_PREFIX_PATH: /opt/erde
          AMENT_PREFIX_PATH: /opt/erde
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths erde_ros --event-handlers console_cohesion+

      - name: Smoke test the node
        env:
          CMAKE_PREFIX_PATH: /opt/erde
          AMENT_PREFIX_PATH: /opt/erde
        run: bash scripts/ros_smoke.sh
