#
# Example parameters for `erde_node` (used by the integration test as well).
erde:
  ros__parameters:
    input: /tmp/erde-ros-input.mp4
    input_format: ''
    input_options: ''
    filter: ''
    width: 0
    height: 0
    codec: libx264
    # "" = 软件编码；rkmpp = RK3566/RK3588 硬件编码；vaapi / cuda = x86 GPU
    hw: ''
    hw_device: ''
    bitrate: 2000000
    gop: 12
    fps: 30
    frame_id: camera
    topic: ~/image/compressed
    autostart: true
